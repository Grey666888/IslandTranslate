name: IslandTranslate
options:
  bundleIdPrefix: org.local.islandtranslate
  deploymentTarget:
    iOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: '0.1.0'
targets:
  IslandTranslate:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.local.islandtranslate.app
    info:
      path: Generated/App-Info.plist
      properties:
        CFBundleDisplayName: 岛译验证版
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        UIBackgroundModes: [audio]
        CFBundleURLTypes:
          - CFBundleURLSchemes: [islandtranslate]
    dependencies:
      - target: IslandWidget
  IslandWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.local.islandtranslate.app.widget
        APPLICATION_EXTENSION_API_ONLY: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: '$(inherited) WIDGET_EXTENSION'
    info:
      path: Generated/Widget-Info.plist
      properties:
        CFBundleDisplayName: 岛译
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
schemes:
  IslandTranslate:
    build:
      targets:
        IslandTranslate: all
